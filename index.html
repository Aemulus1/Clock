<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>This site now exists</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
      color: #eee;
      font-family: Arial, Helvetica, sans-serif;
    }
    main { text-align: center; padding: 24px; }
    h1 {
      margin: 0 0 18px;
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 400;
      letter-spacing: .025em;
    }
    #clock {
      color: #aaa;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(16px, 3vw, 22px);
      font-variant-numeric: tabular-nums;
      letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <main>
    <h1>this site now exists</h1>
    <div id="clock" role="timer" aria-live="off">0000000000 hours</div>
  </main>
  <script>
    // Set this once, to the moment the page is published (UTC).
    const launchedAt = new Date("2026-10-24T13:30:00+02:00");
    const clock = document.getElementById("clock");

    function updateClock() {
      const elapsedHours = Number.isNaN(launchedAt.getTime())
        ? 0
        : Math.max(0, Math.floor((Date.now() - launchedAt.getTime()) / 3600000));
      clock.textContent = String(elapsedHours).padStart(10, "0") + " hours";
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
